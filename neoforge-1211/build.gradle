plugins { id 'net.neoforged.moddev' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
base { archivesName = 'me-subnet-bus-neoforge-1.21.1' }
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.java.srcDir '../core/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'
sourceSets {
}
neoForge {
    version = '21.1.247'
    runs {
        client {
            client(); gameDirectory = file('run')
        }
        server { server(); gameDirectory = file('run-server'); programArgument '--nogui' }
    }
    mods {
        me_subnet_bus { sourceSet(sourceSets.main) }
    }
}
dependencies {
    implementation 'org.appliedenergistics:appliedenergistics2:19.2.17'
    runtimeOnly 'org.appliedenergistics:guideme:21.1.17'
}
tasks.named('jar') { from rootProject.file('LICENSE') }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
