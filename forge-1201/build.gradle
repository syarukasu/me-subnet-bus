plugins { id 'net.minecraftforge.gradle' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
base { archivesName = 'me-subnet-bus-forge-1.20.1' }
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.java.srcDir '../core/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'
sourceSets {
    gameTest {
        java.srcDir '../common/src/gameTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath
            mods { me_subnet_bus { source sourceSets.main } }
        }
        client {
            if (project.hasProperty('visualTest')) {
                property 'subnet.visual','true'
                if (project.hasProperty('menuSmoke')) property 'subnet.menuSmoke','true'
                if (project.hasProperty('artSmoke')) property 'subnet.artSmoke','true'
                args '--quickPlaySingleplayer','SubnetQA'
                mods { me_subnet_bus_test { source sourceSets.gameTest } }
            }
        }
        server { args '--nogui' }
        gameTestServer {
            workingDirectory project.file('build/gametest')
            property 'forge.enabledGameTestNamespaces', 'me_subnet_bus_test'
            property 'subnet.report', project.file('build/gametest/results.xml').absolutePath
            mods { me_subnet_bus_test { source sourceSets.gameTest } }
        }
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'
    implementation fg.deobf('appeng:appliedenergistics2-forge:15.4.10')
    runtimeOnly fg.deobf('org.appliedenergistics:guideme:20.1.7')
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('jar') { from rootProject.file('LICENSE'); finalizedBy 'reobfJar' }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
