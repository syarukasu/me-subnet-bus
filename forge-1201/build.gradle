plugins { id 'net.minecraftforge.gradle' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
base { archivesName = 'me-subnet-bus-forge-1.20.1' }
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.java.srcDir '../core/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'
sourceSets {
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath
            mods { me_subnet_bus { source sourceSets.main } }
        }
        client {
        }
        server { args '--nogui' }
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'
    implementation fg.deobf('appeng:appliedenergistics2-forge:15.4.10')
    runtimeOnly fg.deobf('org.appliedenergistics:guideme:20.1.7')
}
tasks.named('jar') { from rootProject.files('LICENSE', 'LICENSE-MIT', 'LICENSING.md'); finalizedBy 'reobfJar' }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
